name: Build APK

on:
  push:
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew assembleRelease --stacktrace -PdataRepo=${{ github.repository }}
      - run: cp app/build/outputs/apk/release/app-release.apk AlmasryMarket.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AlmasryMarket-apk
          path: android/AlmasryMarket.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AlmasryMarket.apk \
            --title "المصري ماركت (${GITHUB_SHA::7})" \
            --notes "آخر نسخة متبنية من main." --latest
