name: Market agents

on:
  push:
    branches: [main]
    paths: ["agents/**", ".github/workflows/agents.yml"]
  schedule:
    - cron: "7 * * * *"      # every hour
  workflow_dispatch:
    inputs:
      force_report:
        description: "Rebuild the AI report now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: market-agents
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: |
          pip install -r agents/requirements.txt
          pip install egx || true
      - name: Load previous data
        run: |
          mkdir -p data
          git fetch --depth 1 origin data && git show origin/data:market.json > data/market.json || rm -f data/market.json
      - name: Run agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FORCE_REPORT: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.force_report)) && '1' || '0' }}
        run: python agents/run.py
      - name: Publish to data branch
        run: |
          cd data
          git init -q -b data
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add market.json
          git commit -qm "data $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
